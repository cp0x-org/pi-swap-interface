# cp0x Swap: static nginx for dist/ (see Dockerfile). It runs as the unprivileged "nginx" user and can run on a
# read-only root filesystem, because everything it writes goes under /tmp (mount a tmpfs there, as
# docker/compose.yaml does). Headers match vercel.json and `npx` (bin/headers.mjs).

worker_processes auto;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  charset utf-8;
  charset_types text/css text/plain application/javascript application/json image/svg+xml;

  # No access log: the interface keeps no record of who visits. Enable one here if you need it.
  access_log off;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30s;
  client_max_body_size 1k;

  client_body_temp_path /tmp/nginx-client-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css text/plain application/javascript application/json image/svg+xml;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    autoindex off;
    absolute_redirect off;

    # A static site: anything but GET/HEAD is a mistake or a probe.
    if ($request_method !~ ^(GET|HEAD)$) {
      return 405;
    }

    # The app: hash routing, so there is no SPA fallback and an unknown path is a plain 404.
    location = / {
      include /etc/nginx/cp0x/security-headers.conf;
      add_header Cache-Control "no-cache" always;
      try_files /index.html =404;
    }

    location / {
      include /etc/nginx/cp0x/security-headers.conf;
      add_header Cache-Control "no-cache" always;
      try_files $uri =404;
    }

    # Content-hashed Vite output: never changes, cache for a year.
    location /assets/ {
      include /etc/nginx/cp0x/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    # Operator config, read by the app once per page load. Mount a directory holding runtime-config.json at
    # /config. If there is none, this is a 404 and the app uses its built-in defaults.
    location = /runtime-config.json {
      include /etc/nginx/cp0x/security-headers.conf;
      add_header Cache-Control "no-cache" always;
      root /config;
      try_files /runtime-config.json =404;
    }
  }
}
