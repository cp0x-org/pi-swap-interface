# On a version tag (v0.1.0, ...): build the release, pack dist/ as an IPFS CAR, compute its root CID and attach
# the CAR, the CID and checksums to the GitHub release. If an IPFS pinning endpoint is configured, the CAR is also
# imported and pinned there. Without one the release still carries the CAR, which anyone can pin:
#   ipfs dag import --pin-roots cp0x-swap-<tag>.car
#
# Two jobs, so the tool that packs the CAR never runs where a write token or a secret is: `build` (read-only token,
# no secrets) builds dist/, records its checksums BEFORE anything is fetched from npm, packs the CAR with install
# scripts off, checks the CAR's blocks against those checksums with our own dependency-free reader
# (.github/scripts/verify-car.mjs), and uploads the files; `release` (contents: write + the pin secrets) only
# downloads them, re-checks SHA256SUMS, pins and attaches. It installs and runs nothing from npm.
#
# Optional repository secrets (the pin step is skipped when IPFS_API_URL is absent):
#   IPFS_API_URL   base URL of a Kubo-compatible RPC API, e.g. https://ipfs.example.org:5001
#   IPFS_API_AUTH  value of the Authorization header for it, e.g. "Bearer <token>" or "Basic <base64>"
name: IPFS release

on:
  push:
    tags: ["v*"]

# Nothing by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: ipfs-${{ github.ref }}
  cancel-in-progress: false

env:
  IPFS_CAR_VERSION: 3.1.0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    outputs:
      cid: ${{ steps.car.outputs.cid }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from package.json packageManager)
      # No dependency cache on release builds: a poisoned cache must not reach a published CID.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Tag matches package.json version
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$TAG" != "v$version" ]; then echo "tag $TAG != v$version (package.json)"; exit 1; fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Prepare dist for IPFS (meta CSP, licences) and check it
        run: |
          # Gateways send none of our headers, so the CSP travels inside index.html.
          node .github/scripts/inject-meta-csp.mjs dist/index.html
          # The build already emits both (vite.config.ts licences()); copying again is a no-op guard.
          cp LICENSE THIRD_PARTY_NOTICES.md dist/
          # --no-api: an IPFS release never holds a cp0x host, whatever the environment says (ARCHITECTURE D24).
          node .github/scripts/guard-dist.mjs dist --no-api

      - name: Record dist before any npm fetch
        run: |
          # The tarball and the per-file checksums are taken from the checked dist/ before ipfs-car (an unpinned
          # npm tree) is fetched, so whatever that tree does, the CAR is verified against these.
          tar --sort=name --mtime='2000-01-01 00:00Z' --owner=0 --group=0 --numeric-owner -C dist -cf - . | gzip -n > "cp0x-swap-$TAG-dist.tar.gz"
          (cd dist && find . -type f -print0 | sort -z | xargs -0 sha256sum) > dist.files.sha256

      - name: Pack CAR and compute the CID
        id: car
        env:
          # No package's install script runs: ipfs-car's dependencies resolve fresh from npm.
          npm_config_ignore_scripts: "true"
        run: |
          car="cp0x-swap-$TAG.car"
          npx --yes "ipfs-car@$IPFS_CAR_VERSION" pack dist --no-wrap --output "$car"
          cid=$(npx --yes "ipfs-car@$IPFS_CAR_VERSION" roots "$car" | sed -n 1p)
          case "$cid" in bafy*) ;; *) echo "unexpected root CID: $cid"; exit 1 ;; esac
          echo "$cid" > "cp0x-swap-$TAG.cid.txt"
          echo "cid=$cid" >> "$GITHUB_OUTPUT"
          echo "car=$car" >> "$GITHUB_OUTPUT"

      - name: Verify the CAR independently (every block hash, and the tree equals dist)
        env:
          CID: ${{ steps.car.outputs.cid }}
          CAR: ${{ steps.car.outputs.car }}
        run: |
          # dist/ itself is re-checked first: a rewrite after the checksums were taken fails here.
          (cd dist && sha256sum --quiet -c ../dist.files.sha256)
          node .github/scripts/verify-car.mjs "$CAR" "$CID" dist.files.sha256 dist

      - name: Checksums and summary
        env:
          CID: ${{ steps.car.outputs.cid }}
          CAR: ${{ steps.car.outputs.car }}
        run: |
          sha256sum "$CAR" "cp0x-swap-$TAG.cid.txt" "cp0x-swap-$TAG-dist.tar.gz" > "cp0x-swap-$TAG.SHA256SUMS"
          {
            echo "### cp0x Swap $TAG on IPFS"
            echo ""
            echo "Root CID: \`$CID\`"
            echo ""
            echo "- https://$CID.ipfs.dweb.link/"
            echo "- ipfs://$CID/"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ipfs-release
          path: |
            cp0x-swap-${{ github.ref_name }}.car
            cp0x-swap-${{ github.ref_name }}.cid.txt
            cp0x-swap-${{ github.ref_name }}-dist.tar.gz
            cp0x-swap-${{ github.ref_name }}.SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      CID: ${{ needs.build.outputs.cid }}
      # Only a yes/no reaches the job env; the secret values are passed to the pin step alone.
      HAS_PIN_ENDPOINT: ${{ secrets.IPFS_API_URL != '' }}
    steps:
      # No checkout, no install, no build: this job only moves the verified files.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 (same pin as the cp0x-elysium workflows)
        with:
          name: ipfs-release

      - name: Check the files against SHA256SUMS and the CID
        run: |
          sha256sum -c "cp0x-swap-$TAG.SHA256SUMS"
          [ "$(cat "cp0x-swap-$TAG.cid.txt")" = "$CID" ] || { echo "CID file differs from the build's output"; exit 1; }

      - name: Pin (Kubo RPC dag/import)
        if: env.HAS_PIN_ENDPOINT == 'true'
        env:
          IPFS_API_URL: ${{ secrets.IPFS_API_URL }}
          IPFS_API_AUTH: ${{ secrets.IPFS_API_AUTH }}
          CAR: cp0x-swap-${{ github.ref_name }}.car
        run: |
          auth=()
          if [ -n "${IPFS_API_AUTH:-}" ]; then auth=(-H "Authorization: $IPFS_API_AUTH"); fi
          out=$(curl -fsS -X POST "${auth[@]}" -F "file=@$CAR" "${IPFS_API_URL%/}/api/v0/dag/import?pin-roots=true")
          echo "$out" | grep -q "\"$CID\"" || { echo "pinning endpoint did not report root $CID"; exit 1; }
          if echo "$out" | grep -q '"PinErrorMsg":"[^"]'; then echo "pin error: $out"; exit 1; fi
          echo "Pinned $CID" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes=$(printf 'IPFS root CID: `%s`\n\nOpen it on a subdomain gateway (each CID gets its own origin), for example https://%s.ipfs.dweb.link/, or through your own node at ipfs://%s/. Avoid path gateways such as https://ipfs.io/ipfs/...: every site on them shares one origin, and so one browser storage (the app ignores its saved settings there).\n\nThe CAR, the CID and a tarball of the same files are attached; SHA256SUMS covers them.' "$CID" "$CID" "$CID")
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "cp0x Swap $TAG" --notes "$notes"
          fi
          gh release upload "$TAG" --clobber \
            "cp0x-swap-$TAG.car" "cp0x-swap-$TAG.cid.txt" "cp0x-swap-$TAG-dist.tar.gz" "cp0x-swap-$TAG.SHA256SUMS"
