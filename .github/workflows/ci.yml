# Every push and pull request: the full gate from ARCHITECTURE.md §7, plus checks on the built output and its
# HTTP headers (npx server and Docker image). Actions are pinned by commit SHA; the version is in the comment.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from package.json packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Signing choke point (wallet writes only in src/execute/accounts)
        run: bash .github/scripts/guard-wallet-writes.sh
      - run: pnpm lint
      - name: Typecheck
        run: pnpm exec tsc -p tsconfig.app.json --noEmit
      - name: Unit tests
        run: pnpm exec vitest run
      - name: runtime-config.example.json matches the defaults
        run: node .github/scripts/runtime-config-example.mjs --check
      - run: pnpm build
      - name: Built output (no inline scripts, trackers, cp0x hosts or remote CSS)
        run: node .github/scripts/guard-dist.mjs dist --no-api
      # The hosted build's Standard mode (D30): exactly the one cp0x origin it was built with, nothing else cp0x.
      - name: Standard build (VITE_CP0X_API) holds exactly that cp0x origin
        env:
          VITE_CP0X_API: https://cp0x-api.vercel.app
        run: |
          pnpm exec vite build --outDir dist-standard
          node .github/scripts/guard-dist.mjs dist-standard --api "$VITE_CP0X_API"

      - name: npx server headers
        run: |
          node bin/cli.mjs --no-browser --port 4180 &
          for i in $(seq 1 30); do curl -fs -o /dev/null http://127.0.0.1:4180/ && break; sleep 1; done
          node .github/scripts/smoke-http.mjs http://127.0.0.1:4180/ --local

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 14

  e2e:
    name: Playwright (phone, tablet, desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  docker:
    name: Docker image (build, headers, mounted config)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker build -t cp0x/pi-swap-interface:ci .
      - name: Run without a config and check headers
        run: |
          docker run -d --name swap -p 127.0.0.1:8080:8080 cp0x/pi-swap-interface:ci
          for i in $(seq 1 30); do curl -fs -o /dev/null http://127.0.0.1:8080/ && break; sleep 1; done
          node .github/scripts/smoke-http.mjs http://127.0.0.1:8080/
          docker rm -f swap
      - name: Run hardened (read-only, no capabilities) with a mounted runtime-config.json
        run: |
          mkdir -p ci-config
          echo '{"demo": true, "providers": {"symbiosis": false}}' > ci-config/runtime-config.json
          docker run -d --name swap -p 127.0.0.1:8080:8080 --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true -v "$PWD/ci-config:/config:ro" cp0x/pi-swap-interface:ci
          for i in $(seq 1 30); do curl -fs -o /dev/null http://127.0.0.1:8080/ && break; sleep 1; done
          node .github/scripts/smoke-http.mjs http://127.0.0.1:8080/ --config ci-config/runtime-config.json
          docker logs swap
          docker rm -f swap
